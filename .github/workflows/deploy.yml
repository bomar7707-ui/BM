name: Nasazení na GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Nastavení prostředí Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalace závislostí
        run: bun install

      - name: Sestavení produkční verze (Vite)
        run: bun run build

      - name: Publikování do větve gh-pages
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Nahrání artefaktu pro GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
